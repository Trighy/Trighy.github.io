<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Refuge | Trighy / Oryn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="spirit-tree-bg"></div>
    
    <div class="container fade-in">
        <header>
            <div class="profile-pic"></div>
            <h1 data-i18n="greeting">Hello, I'm Trighy / Oryn!</h1>
            <p class="subtitle" data-i18n="subtitle">Autistic, INFJ, Straight, White, Male.</p>
        </header>

        <section class="about">
            <p data-i18n="description">Welcome to my little refuge on the internet! Here I'll guide you through my interests and who I am. Feel free to look around, you're welcome!</p>
        </section>

        <section class="links">
            <a href="https://steamcommunity.com/id/Oryn76561198375640870/" target="_blank" class="glow-button ori-light">
                <i class="fab fa-steam"></i> Steam
            </a>
            <a href="https://backloggd.com/u/Trighy/" target="_blank" class="glow-button ori-light">
                <i class="fas fa-gamepad"></i> Backloggd
            </a>
            <a href="https://letterboxd.com/trighy/" target="_blank" class="glow-button ori-light">
                <i class="fas fa-film"></i> Letterboxd
            </a>
        </section>
    </div>

        <audio id="bgMusic" loop>
            <source src="musica.flac" type="audio/flac">
        </audio>

        <button id="musicToggle" class="music-btn glow-button ori-light">
            <i class="fas fa-music"></i>
        </button>

        <div class="lang-switcher">
            <img src="https://flagcdn.com/w40/br.png" alt="Português" onclick="changeLanguage('pt')">
            <img src="https://flagcdn.com/w40/us.png" alt="English" onclick="changeLanguage('en')">
            <img src="https://flagcdn.com/w40/es.png" alt="Español" onclick="changeLanguage('es')">
        </div>

    <script src="script.js"></script>
</body>
</html>
